name: Lossless current-host budget qualification
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: lossless-budget-${{ github.run_id }}
  cancel-in-progress: false
env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=8192
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  BASE_SHA: ${{ inputs.base_sha }}
jobs:
  paired-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [stock, repaired]
    env:
      ROLE: ${{ matrix.role }}
    steps:
      - name: Admit exact pins
        run: |
          python3 - <<'PY'
          import os,re
          assert os.environ['BASE_SHA']=='13a9b6af3197e4fd787eac3969e97929ab39ccce'
          assert re.fullmatch('[0-9a-f]{40}',os.environ['CANDIDATE_SHA'])
          assert os.environ['CANDIDATE_SHA']!=os.environ['BASE_SHA']
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/lossless-claw
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin identical tests; restore only engine on stock
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 - <<'PY'
          import os,json,hashlib,subprocess
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['CANDIDATE_SHA']
          assert not git('status','--porcelain')
          test='test/engine-maintenance-budget.test.ts'; before=hashlib.sha256(Path(test).read_bytes()).hexdigest()
          if os.environ['ROLE']=='stock':subprocess.run(['git','restore','--source='+os.environ['BASE_SHA'],'--worktree','--','src/engine.ts'],check=True)
          assert hashlib.sha256(Path(test).read_bytes()).hexdigest()==before
          changed=git('diff','--name-only').splitlines()
          assert changed==(['src/engine.ts'] if os.environ['ROLE']=='stock' else [])
          proof=Path(os.environ['RUNNER_TEMP'])/'proof'
          (proof/'source.json').write_text(json.dumps({'candidate':os.environ['CANDIDATE_SHA'],'base':os.environ['BASE_SHA'],'role':os.environ['ROLE'],'testSha256':before,'engineSha256':hashlib.sha256(Path('src/engine.ts').read_bytes()).hexdigest(),'restoredPaths':changed},indent=2)+'\n')
          (proof/'source.patch').write_text(git('diff','--binary')+'\n')
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Frozen package dependencies
        run: npm ci
      - name: Execute once; preserve exit and elapsed time
        run: |
          python3 - <<'PY'
          import json,os,time,subprocess
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'proof'
          c=['npm','test','--','--maxWorkers=2','--reporter=verbose','--reporter=json','--outputFile='+str(p/'tests.json')]
          if os.environ['ROLE']=='stock':c+=['engine-maintenance-budget.test.ts']
          start=time.monotonic()
          with (p/'tests.log').open('w') as log:r=subprocess.run(c,stdout=log,stderr=subprocess.STDOUT)
          (p/'execution.json').write_text(json.dumps({'command':c,'exit':r.returncode,'wallSeconds':round(time.monotonic()-start,3)},indent=2)+'\n')
          PY
      - name: Verify exact stock failures and unchanged controls
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'proof'; r=json.loads((p/'tests.json').read_text()); e=json.loads((p/'execution.json').read_text()); s=json.loads((p/'source.json').read_text())
          assert hashlib.sha256(Path('test/engine-maintenance-budget.test.ts').read_bytes()).hexdigest()==s['testSha256']
          budget=[a for t in r['testResults'] if t['name'].endswith('/test/engine-maintenance-budget.test.ts') for a in t['assertionResults']]
          assert len(budget)==17 and all(a['status'] in ('passed','failed') for a in budget),[(a['fullName'],a['status']) for a in budget]
          expected=['settings without runtimeContext budget','settings supersede old fallback debt','context supersedes old fallback debt','configured cap still applies','smaller settings replace a large budget','settings precede conflicting legacy context',"recreated engine uses current settings (64000), not an earlier turn's allowance", "recreated engine uses current settings (500000), not an earlier turn's allowance",'current settings override an old queued request in the same engine','immediate publication preserves the smaller current allowance (500000/64000)','revalidates published debt using the current allowance even during backoff']
          stock=os.environ['ROLE']=='stock'
          for name in expected:
              matches=[a for a in budget if a['fullName'].endswith(name)]
              assert len(matches)==1,(name,matches)
              assert matches[0]['status']==('failed' if stock else 'passed'),matches
          failed=[a['fullName'] for t in r['testResults'] for a in t['assertionResults'] if a['status']=='failed']
          assert len(failed)==(len(expected) if stock else 0),failed
          assert e['exit']==(1 if stock else 0),e
          assert r['success'] is (not stock)
          assert r['numFailedTests']==len(failed)
          assert r['numPassedTests']>0
          v={'role':os.environ['ROLE'],'verified':True,'total':r['numTotalTests'],'passed':r['numPassedTests'],'failed':len(failed),'budgetCasesExecuted':len(budget),'wallSeconds':e['wallSeconds'],'expectedStockFailures':expected}
          (p/'validated.json').write_text(json.dumps(v,indent=2)+'\n');print(json.dumps(v,indent=2))
          PY
      - name: Package-owned typecheck
        if: ${{ !cancelled() && matrix.role == 'repaired' }}
        run: |
          set -o pipefail
          /usr/bin/time -p npm run typecheck 2>&1 | tee "$RUNNER_TEMP/proof/types.log"
      - name: Package-owned canonical build
        if: ${{ !cancelled() && matrix.role == 'repaired' }}
        run: |
          set -o pipefail
          /usr/bin/time -p npm run build 2>&1 | tee "$RUNNER_TEMP/proof/build.log"
      - name: Final tracked-source receipt
        if: always()
        run: |
          git status --short > "$RUNNER_TEMP/proof/final-status.txt"
          git diff --binary > "$RUNNER_TEMP/proof/final.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lossless-budget-${{ matrix.role }}-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
          retention-days: 14
