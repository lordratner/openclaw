name: Budget retained-package stable-state and recovery proof
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed budget-only source
        required: true
        default: cf4186f7d2154842b1686961b393d39e243799ef
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_OPTIONS: --max-old-space-size=8192
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  shipped:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Admit exact reviewed source
        run: test "$CANDIDATE_SHA" = cf4186f7d2154842b1686961b393d39e243799ef
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          persist-credentials: false
          sparse-checkout: .qa
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Download immutable exact candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38515883196
          artifact-ids: '11872904440'
          path: ${{ runner.temp }}/budget-package
      - name: Download prior actual passing pilot evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38515883196
          artifact-ids: '11873725881'
          path: ${{ runner.temp }}/prior-shipped-proof
      - name: Admit exact archived package and retained pilot
        run: |
          python3 - <<'PY'
          import os,json,hashlib,tarfile,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);package=root/'budget-package'/'openclaw-2026.10.2.tgz'
          expected='e1eeae94bc8b6635f1cfb712f7913754e90b26863498591ed7637ae03c8bce29'
          assert hashlib.sha256(package.read_bytes()).hexdigest()==expected
          with tarfile.open(package) as archive:
              build=json.load(archive.extractfile('package/dist/build-info.json'))
              assert build['commit']==os.environ['CANDIDATE_SHA'] and build['version']=='2026.10.2'
              plugin=json.load(archive.extractfile('package/dist/extensions/codex/package.json'))
              assert plugin['version']=='2026.10.2' and plugin['openclaw']['build']['bundledDist'] is True
          source=root/'prior-shipped-proof'/'budget-shipped-evidence';pilot=json.loads((source/'pilot-receipt.json').read_text())
          assert pilot['passed'] is True and pilot['candidate']==os.environ['CANDIDATE_SHA']
          assert pilot['assemblyAllowance']==pilot['commitAllowance']==pilot['maintenanceAllowance']==345407
          shutil.copytree(source,root/'budget-shipped-evidence')
          evidence=root/'budget-shipped-full-evidence';evidence.mkdir(exist_ok=True)
          (evidence/'retained-proof.json').write_text(json.dumps({'packageRun':38515883196,'packageArtifact':11872904440,'packageSha256':expected,'packageBuildInfo':build,'pilotRun':38515883196,'pilotArtifact':11873725881,'pilotExecution':'Retained real passing execution, NOT rerun on this job','previousFullScenario':'Failed before callbacks; no credit'},indent=2)+'\n')
          PY
      - name: Install only matching stock native binary in isolated helper prefix
        run: npm install --prefix "$RUNNER_TEMP/budget-native" @openai/codex@0.160.0 --no-fund --no-audit
      - name: Install published stable in task-owned prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/budget-installed"
          npm install --global --prefix "$RUNNER_TEMP/budget-installed" openclaw@2026.10.3 --no-fund --no-audit
      - name: Exercise installed Gateway, stable-state compatibility and durable recovery
        env:
          PROOF_TOOL_DIR: ${{ github.workspace }}/.proof-tools/.qa
          INSTALLED_PREFIX: ${{ runner.temp }}/budget-installed
          INSTALLED_ENTRY: ${{ runner.temp }}/budget-installed/lib/node_modules/openclaw/openclaw.mjs
          CANDIDATE_TARBALL: ${{ runner.temp }}/budget-package/openclaw-2026.10.2.tgz
          PROOF_NATIVE_LAUNCHER: ${{ runner.temp }}/budget-native/node_modules/@openai/codex/bin/codex.js
        run: node .proof-tools/.qa/budget-shipped-full.mjs
      - name: Capture exact source and proof tool identities
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/budget-shipped-full-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/budget-shipped-full-evidence/source-head.txt"
          sha256sum .proof-tools/.qa/*.mjs > "$RUNNER_TEMP/budget-shipped-full-evidence/proof-tools.sha256"
      - name: Redact synthetic endpoint identifiers at artifact egress
        if: always()
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          files=[]
          for name in ('budget-shipped-evidence','budget-shipped-full-evidence'):
              directory=Path(os.environ['RUNNER_TEMP'])/name
              for file in directory.glob('*'):
                  if file.suffix not in ('.log','.json'): continue
                  text=file.read_text()
                  redacted=text.replace('127.0.0.1','[synthetic-loopback]').replace('::1','[synthetic-loopback]').replace('public-synthetic-budget-proof-not-a-credential','[public-dummy-auth]')
                  if redacted!=text: file.write_text(redacted);files.append(name+'/'+file.name)
          out=Path(os.environ['RUNNER_TEMP'])/'budget-shipped-full-evidence'/'egress-redaction.json'
          out.write_text(json.dumps({'modifiedFiles':files,'scope':'Only synthetic loopback identifiers and public dummy auth value; no budget/session/commit assertions changed'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: budget-shipped-full-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/budget-shipped-full-evidence
            ${{ runner.temp }}/budget-shipped-evidence
          if-no-files-found: error
          retention-days: 14
