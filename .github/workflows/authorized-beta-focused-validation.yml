name: Exact selected-history installable package
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed history-only candidate
        required: true
        type: string
permissions:
  contents: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_OPTIONS: --max-old-space-size=8192
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Admit exact source pin
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch('[0-9a-f]{40}',os.environ['CANDIDATE_SHA'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Frozen package-owned environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
          build-all-cache-scope: full
      - name: Canonically build and pack exact history candidate with patched Codex
        env:
          GIT_COMMIT: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/history-package"
          node scripts/package-openclaw-for-docker.mjs --bundle-plugin codex --allow-unreleased-changelog --output-dir "$RUNNER_TEMP/history-package" --output-name openclaw-2026.10.2.tgz --pack-json "$RUNNER_TEMP/history-package/pack.json"
          sha256sum "$RUNNER_TEMP/history-package/openclaw-2026.10.2.tgz" > "$RUNNER_TEMP/history-package/package.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/history-package/source-head.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: history-installed-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/history-package
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
