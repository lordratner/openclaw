name: Budget installed Gateway stable-state and recovery proof
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed budget-only source
        required: true
        default: cf4186f7d2154842b1686961b393d39e243799ef
        type: string
permissions:
  contents: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_OPTIONS: --max-old-space-size=8192
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  shipped:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Admit exact reviewed source
        run: test "$CANDIDATE_SHA" = cf4186f7d2154842b1686961b393d39e243799ef
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          persist-credentials: false
          sparse-checkout: .qa
      - name: Frozen package-owned environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
          build-all-cache-scope: full
      - name: Canonically build and pack exact candidate with patched Codex
        env:
          GIT_COMMIT: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/budget-package" "$RUNNER_TEMP/budget-shipped-full-evidence"
          node scripts/package-openclaw-for-docker.mjs --bundle-plugin codex --allow-unreleased-changelog --output-dir "$RUNNER_TEMP/budget-package" --output-name openclaw-2026.10.2.tgz --pack-json "$RUNNER_TEMP/budget-package/pack.json"
          sha256sum "$RUNNER_TEMP/budget-package/openclaw-2026.10.2.tgz" > "$RUNNER_TEMP/budget-shipped-full-evidence/package.sha256"
          cp "$RUNNER_TEMP/budget-package/pack.json" "$RUNNER_TEMP/budget-shipped-full-evidence/pack.json"
      - name: Install published stable in task-owned prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/budget-installed"
          npm install --global --prefix "$RUNNER_TEMP/budget-installed" openclaw@2026.10.3 --no-fund --no-audit
      - name: Exercise installed Gateway, stable-state compatibility and durable recovery
        env:
          PROOF_TOOL_DIR: ${{ github.workspace }}/.proof-tools/.qa
          INSTALLED_PREFIX: ${{ runner.temp }}/budget-installed
          INSTALLED_ENTRY: ${{ runner.temp }}/budget-installed/lib/node_modules/openclaw/openclaw.mjs
          CANDIDATE_TARBALL: ${{ runner.temp }}/budget-package/openclaw-2026.10.2.tgz
        run: node .proof-tools/.qa/budget-shipped-full.mjs
      - name: Capture exact source and proof tool identities
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/budget-shipped-full-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/budget-shipped-full-evidence/source-head.txt"
          sha256sum .proof-tools/.qa/*.mjs > "$RUNNER_TEMP/budget-shipped-full-evidence/proof-tools.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: budget-shipped-full-${{ github.run_id }}
          path: ${{ runner.temp }}/budget-shipped-full-evidence
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: budget-installed-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/budget-package
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
