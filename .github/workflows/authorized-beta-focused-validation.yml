name: Configured native context final ratchet delta
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify-final-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 16
          persist-credentials: false
      - name: Verify exact allowance shrink and inherited successful executions
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'proof';prior='a31bd4d035a1a832ae2bf95ec8b46d8400be1fca';fork='55a3be43fe8ab39300d8ea7b5aa408d29f941f90';ci='11d75e447e4452e7a88bf92ac5d684c1abad8c07'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['CANDIDATE_SHA'] and not git('status','--porcelain')
          assert git('merge-base','HEAD',fork)==fork
          changed=git('diff','--name-only',prior,'HEAD').splitlines();assert changed==['config/assertion-safety-baseline.txt'],changed
          f=changed[0];before=subprocess.check_output(['git','show',prior+':'+f],text=True);after=Path(f).read_text();line='extensions/codex/src/app-server/run-attempt-context.ts\t2\n'
          assert before.count(line)==1 and after==before.replace(line,'')
          comparison=json.loads(subprocess.check_output(['gh','api','repos/openclaw/openclaw/compare/'+ci+'...'+prior],text=True));assert comparison['merge_base_commit']['sha']==fork
          run='38491048542';jobs=json.loads(subprocess.check_output(['gh','api','repos/lordratner/openclaw/actions/runs/'+run+'/jobs?per_page=100'],text=True))
          gates=[j for j in jobs['jobs'] if j['name']=='repaired-gates'];assert len(gates)==1
          steps={s['name']:s['conclusion'] for s in gates[0]['steps']}
          required=['Verify and retain unchanged production proof','Verify exact JavaScript erasure equivalence of the sole type-only production delta','Package-owned extension production type gate','Package-owned focused lint gate']
          assert all(steps.get(n)=='success' for n in required),steps
          subprocess.run(['gh','run','download',run,'--repo','lordratner/openclaw','--name','context-budget-repaired-gates-'+run+'-1','--dir',str(p/'gates')],check=True)
          assert (p/'gates/head.txt').read_text().strip()==prior and (p/'gates/generated.patch').stat().st_size==0
          equivalence=json.loads((p/'gates/type-erasure-equivalence.json').read_text());assert equivalence['current']==prior and equivalence['equal'] is True
          reuse=json.loads((p/'gates/production-proof-reuse.json').read_text());assert reuse['current']==prior and reuse['retainedProduction']=='ee459ace9b15a3ccd882e5f016c844d13c126c2c' and reuse['runId']=='38478593656'
          for role in ['stock','repaired']:
              rolejobs=[j for j in jobs['jobs'] if j['name']=='regression ('+role+')'];assert len(rolejobs)==1 and rolejobs[0]['conclusion']=='success'
              destination=p/role;subprocess.run(['gh','run','download',run,'--repo','lordratner/openclaw','--name','context-budget-'+role+'-'+run+'-1','--dir',str(destination)],check=True)
              source=json.loads((destination/'source.json').read_text());validated=json.loads((destination/'validated.json').read_text());assert source['candidate']==prior and validated['verified'] is True
          receipt={'candidate':os.environ['CANDIDATE_SHA'],'prior':prior,'delta':changed,'removedAllowance':line.strip(),'actualCiBase':ci,'verifiedForkPoint':fork,'retainedRun':run,'retainedSuccessfulGateSteps':required,'testExecutionsRetainedNotRepeated':True,'jsEquivalence':equivalence}
          (p/'retained-qualification.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2))
          PY
      - name: Frozen package-owned environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: 'true'
          install-bun: 'false'
          frozen-lockfile: 'true'
          cache-mode: off
      - name: Fresh final assertion safety against verified branch fork point
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm check:assertion-safety --base 55a3be43fe8ab39300d8ea7b5aa408d29f941f90 2>&1 | tee "$RUNNER_TEMP/proof/assertion-safety.log"
      - name: Fresh format for the two preceding corrected files
        if: '!cancelled()'
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm format:check extensions/codex/src/app-server/run-attempt-context.ts src/agents/embedded-agent-runner/run.overflow-compaction.loop.test.ts 2>&1 | tee "$RUNNER_TEMP/proof/format.log"
      - name: Final tracked-source receipt
        if: always()
        run: |
          git status --short > "$RUNNER_TEMP/proof/final-status.txt"
          git diff --binary > "$RUNNER_TEMP/proof/generated.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: context-budget-final-ratchet-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
          retention-days: 14
