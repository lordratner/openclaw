# Fork QA branch only; not part of the upstream product patch.
name: Native context candidate formatting preparation
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      CI: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Admit exact source pins
        run: |
          python3 - <<'PY'
          import os, re
          for field in ['CANDIDATE_SHA', 'BASE_SHA']:
              assert re.fullmatch('[0-9a-f]{40}', os.environ[field])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Freeze changed source set
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff "$BASE_SHA" HEAD --name-only > "$RUNNER_TEMP/proof/changed-files.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/head.txt"
      - name: Package-owned frozen environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          frozen-lockfile: 'true'
          cache-mode: off
      - name: Format only candidate files and retain exact patch
        run: |
          set -euo pipefail
          mapfile -t paths < "$RUNNER_TEMP/proof/changed-files.txt"
          test "${#paths[@]}" -gt 0
          pnpm format:fix "${paths[@]}" 2>&1 | tee "$RUNNER_TEMP/proof/format.log"
          git diff --check
          git diff --binary > "$RUNNER_TEMP/proof/format.patch"
          git diff --name-only > "$RUNNER_TEMP/proof/formatted-files.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-context-format-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
          retention-days: 14
