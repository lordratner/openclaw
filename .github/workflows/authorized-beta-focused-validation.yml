name: History conflict-layout focused proof
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38583652101
          name: context-budget-repaired-38583652101-1
          path: ${{ runner.temp }}/prior-tests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38583652101
          name: history-retained-production-38583652101
          path: ${{ runner.temp }}/prior-retained
      - name: Admit exact one-test-layout delta and unchanged production/retained tests
        run: |
          python3 - <<'PY'
          import os,json,hashlib,subprocess,re
          from pathlib import Path
          prior='33f658df1d9fd4304df0a6a33d90f2312ead64a6';production='79bfb74cbe1f68f98dbfbe1bd0654e1144820718';file='extensions/codex/src/app-server/context-engine-projection.test.ts'
          candidate=os.environ['CANDIDATE_SHA'];assert re.fullmatch('[0-9a-f]{40}',candidate)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==candidate and not git('status','--porcelain')
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',prior],check=True)
          assert git('diff','--name-only',prior,candidate).splitlines()==[file]
          assert hashlib.sha256(Path(file).read_bytes()).hexdigest()=='e4d6e168294a0f2319c4b9721e4aa94124ecc9908e9a41e3b3e57bf9ee3dc852'
          previousTests=Path(os.environ['RUNNER_TEMP'])/'prior-tests';previousRetained=Path(os.environ['RUNNER_TEMP'])/'prior-retained'
          source=json.loads((previousTests/'source.json').read_text());assert source['candidate']==prior
          for p,sha in source['sourceSha256'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,p
          retained=json.loads((previousRetained/'retained.json').read_text());assert retained['candidate']==prior and retained['priorSource']==production
          for record in retained['retainedTests']:assert hashlib.sha256(Path(record['path']).read_bytes()).hexdigest()==record['sha256']
          seed='extensions/codex/src/app-server/run-attempt.history-seed.test.ts';assert hashlib.sha256(Path(seed).read_bytes()).hexdigest()==source['testSha256'][seed]
          report=json.loads((previousTests/'tests.json').read_text());suite=next(s for s in report['testResults'] if s['name'].endswith('/'+seed));assert len(suite['assertionResults'])==14 and all(a['status']=='passed' for a in suite['assertionResults'])
          receipt={'candidate':candidate,'priorSource':prior,'productionSource':production,'delta':[file],'retainedPassed':retained['retainedPassed']+14,'retainedFiles':retained['retainedTests']+[{'path':seed,'sha256':source['testSha256'][seed],'passed':14}],'semantics':'Only three independent helper cases moved/describe renamed; no main merge or runtime/source change','retainedTypesAndBuild':'Same production79b; previous typed components and canonical package identity unchanged'}
          assert receipt['retainedPassed']==176 and len(receipt['retainedFiles'])==10
          proof=Path(os.environ['RUNNER_TEMP'])/'proof';proof.mkdir(exist_ok=True);(proof/'source.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (proof/'test-files.json').write_text(json.dumps([file])+'\n')
          PY
      - name: Frozen package-owned semantic environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: 'true'
          install-bun: 'false'
          frozen-lockfile: 'true'
          cache-mode: off
      - name: Execute changed projection/builder suite once
        run: |
          python3 - <<'PY'
          import os,json,subprocess,time
          from pathlib import Path
          proof=Path(os.environ['RUNNER_TEMP'])/'proof';file=json.loads((proof/'test-files.json').read_text())[0]
          command=['pnpm','test',file,'--maxWorkers=1','--passWithNoTests=false','--reporter=verbose','--reporter=json','--outputFile='+str(proof/'tests.json')]
          start=time.monotonic()
          with (proof/'tests.log').open('w') as log:result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
          elapsed=round(time.monotonic()-start,3);(proof/'execution.json').write_text(json.dumps({'command':command,'exit':result.returncode,'wallSeconds':elapsed},indent=2)+'\n')
          report=json.loads((proof/'tests.json').read_text());assert result.returncode==0 and report['success'] is True
          records=[a for s in report['testResults'] for a in s['assertionResults']];assert len(records)==35 and all(a['status']=='passed' for a in records)
          assert sum(a['fullName'].startswith('buildCodexHistoryItems ') for a in records)==3
          (proof/'validated.json').write_text(json.dumps({'freshPassed':35,'failed':0,'skipped':0,'wallSeconds':elapsed,'retainedPassed':176},indent=2)+'\n')
          PY
      - name: Fresh scoped format
        if: '!cancelled()'
        run: |
          set -euo pipefail
          pnpm format:check extensions/codex/src/app-server/context-engine-projection.test.ts 2>&1 | tee "$RUNNER_TEMP/proof/format.log"
      - name: Fresh assertion-safety at frozen fork
        if: '!cancelled()'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 55a3be43fe8ab39300d8ea7b5aa408d29f941f90
          pnpm check:assertion-safety --base 55a3be43fe8ab39300d8ea7b5aa408d29f941f90 2>&1 | tee "$RUNNER_TEMP/proof/assertion-safety.log"
      - name: Fresh scoped lint
        if: '!cancelled()'
        run: |
          set -euo pipefail
          node scripts/run-oxlint.mjs --tsconfig extensions/tsconfig.json extensions/codex/src/app-server/context-engine-projection.test.ts 2>&1 | tee "$RUNNER_TEMP/proof/lint.log"
      - name: Capture clean source readback
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/proof/head.txt"
          git diff --binary > "$RUNNER_TEMP/proof/generated.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: history-layout-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
          retention-days: 14
