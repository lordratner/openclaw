name: Budget shipped Gateway and stable-state proof
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed budget-only source
        required: true
        default: cf4186f7d2154842b1686961b393d39e243799ef
        type: string
permissions:
  contents: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_OPTIONS: --max-old-space-size=8192
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
jobs:
  shipped:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Admit exact reviewed source
        run: test "$CANDIDATE_SHA" = cf4186f7d2154842b1686961b393d39e243799ef
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          persist-credentials: false
          sparse-checkout: .qa
      - name: Frozen package-owned environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
          build-all-cache-scope: full
      - name: Build exact candidate installable runtime
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          pnpm build:package
      - name: Run actual shipped CLI and Gateway pilot
        env:
          PROOF_TOOL_DIR: ${{ github.workspace }}/.proof-tools/.qa
        run: node .proof-tools/.qa/budget-shipped-pilot.mjs
      - name: Capture exact source and proof tool hashes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/budget-shipped-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/budget-shipped-evidence/source-head.txt"
          sha256sum .proof-tools/.qa/*.mjs > "$RUNNER_TEMP/budget-shipped-evidence/proof-tools.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: budget-shipped-${{ github.run_id }}
          path: ${{ runner.temp }}/budget-shipped-evidence
          if-no-files-found: error
          retention-days: 14
