name: Official 10.3 core and managed outbound Talk canary on real Nextcloud
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  QUALIFIED_CANARY_RUN_ID: '38940720388'
  QUALIFIED_CANARY_QA_SHA: 754eb4bda906c5a3f7470ddc29b3357e6f98256c
  QUALIFIED_CANARY_SOURCE_SHA256: 86f80bbefa674e028be160c872d160e67a4e640fe782f1445baf1d89c324b020
  QUALIFIED_CANARY_DIST_SHA256: f389d424f083c4185421c267b0cff45d6183cac0adb63b8901692e7bf8c1c33f
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 59cb44796b0f1f0daa0e37af8b1495abb45d9bc1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound-canary-10.3/live-qa
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Refuse an unbound producer and assert exact core source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 59cb44796b0f1f0daa0e37af8b1495abb45d9bc1
          [[ "$QUALIFIED_CANARY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$QUALIFIED_CANARY_QA_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$QUALIFIED_CANARY_SOURCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$QUALIFIED_CANARY_DIST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: ${{ env.QUALIFIED_CANARY_RUN_ID }}
          name: nextcloud-outbound-canary-10.3-${{ env.QUALIFIED_CANARY_RUN_ID }}
          path: ${{ runner.temp }}/nextcloud-outbound-canary-artifact
      - name: Admit source-bound qualified dist without archive links
        env:
          CANARY_ARTIFACT_DIR: ${{ runner.temp }}/nextcloud-outbound-canary-artifact
        run: python3 .proof-tools/.qa/nextcloud-outbound-canary-10.3/live-qa/admit-artifact.py
      - name: Start disposable official Nextcloud and released Talk
        run: bash .proof-tools/.qa/nextcloud-outbound-canary-10.3/live-qa/start-nextcloud.sh
      - name: Prove official full 10.3 core, managed plugin and real delivery/completion
        env:
          OPENCLAW_QA_SOURCE_ROOT: ${{ github.workspace }}
        run: node .proof-tools/.qa/nextcloud-outbound-canary-10.3/live-qa/real-nextcloud.mjs
      - name: Collect synthetic fixture diagnostics and remove owned container
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nextcloud-outbound-live/evidence"
          docker logs nextcloud-outbound-proof > "$RUNNER_TEMP/nextcloud-outbound-live/evidence/container.log" 2>&1 || true
          docker rm --force nextcloud-outbound-proof || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-canary-10.3-native-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-live/evidence/
          if-no-files-found: error
          retention-days: 14
