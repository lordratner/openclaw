name: Nextcloud outbound remaining qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: 0525327b56c327888f58f1e27bc7b2bf52f6612e
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 0525327b56c327888f58f1e27bc7b2bf52f6612e
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38852156084
          name: nextcloud-outbound-proof-38852156084
          path: ${{ runner.temp }}/nextcloud-outbound-prior
      - name: Guard retained proof and complete affected and pending checks
        run: bash .proof-tools/.qa/nextcloud-outbound/resume.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
