name: Talk PR candidate worker-read robustness and relevant gates
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        kind:
          - reader-repeat
          - original-shard
          - siblings
          - types-lint
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CI: "true"
      OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
      OPENCLAW_VITEST_MAX_WORKERS: "2"
      OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
      OPENCLAW_NODE_TEST_CONFIGS_JSON: "[]"
      OPENCLAW_NODE_TEST_ENV_JSON: "null"
      OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: "null"
      OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: "[]"
      OPENCLAW_VITEST_SHARD_NAME: changed-1-repaired
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
      OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE: "1"
      OPENCLAW_NODE_TEST_TARGETS_JSON: '["src/gateway/x-publication-owner-composition.e2e.test.ts","src/plugins/contracts/channel-config-writes.contract.test.ts","src/plugins/contracts/channel-history-limit.contract.test.ts","src/plugins/contracts/channel-media-max-mb.contract.test.ts","src/plugins/contracts/channel-reply-to-mode.contract.test.ts","src/plugins/contracts/channel-response-prefix.contract.test.ts","src/plugins/contracts/config-footprint-guardrails.test.ts"]'
    steps:
      - name: Checkout exact previously failing test merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 5242fb64df13ecdb53aedaf56b5919996f0ad476
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        run: >
          test "$(git rev-parse HEAD)" =
          "5242fb64df13ecdb53aedaf56b5919996f0ad476"

          test -z "$(git status --short)"
      - name: Prepare frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: "false"
          frozen-lockfile: "true"
          cache-mode: off
      - name: Apply regression and conditional owner repair
        env:
          ROLE: repaired-reader
          REGRESSION_PATCH_BASE64: 
          PRODUCTION_PATCH_BASE64: 
        run: >
          python3 - <<'PY'

          import base64, os, subprocess

          from pathlib import Path

          names = ['REGRESSION'] + (['PRODUCTION'] if os.environ['ROLE'] ==
          'repaired-reader' else [])

          for name in names:
              p = Path(os.environ['RUNNER_TEMP'], name.lower() + '.patch')
              p.write_bytes(base64.b64decode(os.environ[name + '_PATCH_BASE64']))
              subprocess.run(['git', 'apply', '--check', str(p)], check=True)
              subprocess.run(['git', 'apply', str(p)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)

          PY
      - name: Build QA runtime from candidate source
        run: pnpm build qaRuntime
      - name: Run predeclared candidate sample or sibling denial contracts
        run: >
          python3 - <<'PY'

          import json, os, subprocess, time

          from pathlib import Path

          kind=os.environ['KIND']

          root=Path(os.environ['RUNNER_TEMP'],
          'robustness');root.mkdir(exist_ok=True)

          if kind=='reader-repeat':
              commands=[['pnpm','test','src/gateway/session-row-projection.prepared-read.test.ts','--maxWorkers=1','--silent=false','--reporter=verbose'] for _ in range(20)]
          elif kind=='original-shard':
              commands=[['node','--import','tsx','scripts/ci-run-node-test-shard.mts'] for _ in range(3)]
          elif kind=='types-lint':
              commands=[['pnpm','tsgo:core'],['pnpm','tsgo:core:test'],['pnpm','exec','oxfmt','--check','src/gateway/control-ui-public-session-read.ts','src/gateway/session-row-projection.prepared-read.test.ts'],['node','scripts/run-oxlint.mjs','src/gateway/control-ui-public-session-read.ts','src/gateway/session-row-projection.prepared-read.test.ts']]
          else:
              commands=[['pnpm','test','src/gateway/control-ui-public-session-read.test.ts','src/gateway/control-ui-public-chat.http.test.ts','src/gateway/control-ui-public-session.http.test.ts','src/gateway/control-ui-public-session.concurrent.test.ts','--maxWorkers=1','--silent=false','--reporter=verbose']]
          results=[]

          for index,command in enumerate(commands,1):
              start=time.monotonic()
              log=root/f'{kind}-{index:02d}.log'
              with log.open('w') as output:
                  result=subprocess.run(command,stdout=output,stderr=subprocess.STDOUT)
              elapsed=time.monotonic()-start
              results.append({'kind':kind,'index':index,'command':command,'exitCode':result.returncode,'wallSeconds':round(elapsed,3)})
              (root/'results.json').write_text(json.dumps(results,indent=2)+'\n')
              print(json.dumps(results[-1]),flush=True)
              print(log.read_text()[-6000:],flush=True)
              if result.returncode: raise SystemExit(result.returncode)
          PY
        env:
          KIND: ${{ matrix.kind }}
      - name: Retain exact source and applied diff
        if: always()
        env:
          ROLE: ${{ matrix.kind }}
        run: >
          python3 - <<'PY'

          import hashlib, json, os, subprocess

          from pathlib import Path

          diff = subprocess.check_output(['git', 'diff', '--binary'], text=True)

          Path(os.environ['RUNNER_TEMP'], 'applied.patch').write_text(diff)

          Path(os.environ['RUNNER_TEMP'], 'source.json').write_text(json.dumps({
              'role': os.environ['ROLE'],
              'expectedSha': '5242fb64df13ecdb53aedaf56b5919996f0ad476',
              'actualSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'status': subprocess.check_output(['git', 'status', '--short'], text=True),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'regressionPatchSha256': 'cdffb1a84c907b253a8e44d51a6ae8fa7fa68b55f9e006e4bc1f388b7b11102c',
              'productionPatchSha256': '8c8c44dfd0e80f0810e0456a564ac21a682dd8ea655a13f94bae3a661a7ad56d',
              'appliedDiffSha256': hashlib.sha256(diff.encode()).hexdigest(),
              'runId': os.environ['GITHUB_RUN_ID'],
              'pool': 'repository-owned Gateway database-worker forks; no CLI pool override',
              'shippingWorkerCallThroughAttestation': True,
              'readerSample': '20 full file runs, maxWorkers1, repository Gateway fork profile',
              'shardSample': '3 original ordered seven-target changed-1 shard runs',
          }, indent=2) + '\n')

          PY
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-read-robustness-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/robustness/
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/applied.patch
          retention-days: 7
