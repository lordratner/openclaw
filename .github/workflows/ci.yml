name: Nextcloud missing worker-profile coverage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: ./.github/actions/setup-node-env
        with: { node-version: "24.19.0", install-bun: "false", semantic-checks: "true", frozen-lockfile: "true", cache-mode: "off" }
      - name: Missing PR database-worker profiles only
        run: bash .qa/nextcloud-refresh/run-missing-workers.sh pr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: { name: "nextcloud-missing-pr-${{ github.run_id }}", path: "${{ runner.temp }}/nextcloud-missing-pr/", retention-days: 14, if-no-files-found: error, include-hidden-files: true }
  release-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 1 }
      - name: Preserve exact inputs
        run: |
          cp -a .qa/nextcloud-refresh "$RUNNER_TEMP/nextcloud-refresh-payload"
          cp -a .qa/nextcloud-release "$RUNNER_TEMP/nextcloud-release-payload"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: openclaw/openclaw, ref: 59cb44796b0f1f0daa0e37af8b1495abb45d9bc1, persist-credentials: false, fetch-depth: 1 }
      - uses: ./.github/actions/setup-node-env
        with: { node-version: "24.19.0", install-bun: "false", semantic-checks: "true", frozen-lockfile: "true", cache-mode: "off" }
      - name: Missing release database-worker profiles only
        run: bash "$RUNNER_TEMP/nextcloud-refresh-payload/run-missing-workers.sh" release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: { name: "nextcloud-missing-release-${{ github.run_id }}", path: "${{ runner.temp }}/nextcloud-missing-release/", retention-days: 14, if-no-files-found: error, include-hidden-files: true }
