name: Nextcloud shared-source refresh qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          semantic-checks: "true"
          frozen-lockfile: "true"
          cache-mode: "off"
      - name: Qualify shared source and canonical generated metadata
        run: bash .qa/nextcloud-refresh/run-pr-proof.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-pr-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-pr-proof/
          retention-days: 14
          if-no-files-found: error
