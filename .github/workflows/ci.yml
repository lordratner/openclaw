name: Current-stable Talk data survival into paired development build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: 412fb31d86cab77ff8fd711d80ddbf5ca2dc6a6e
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 412fb31d86cab77ff8fd711d80ddbf5ca2dc6a6e
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          persist-credentials: false
          sparse-checkout: .qa
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          frozen-lockfile: 'true'
          cache-mode: restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38826014761
          artifact-ids: 12014584447
          path: ${{ runner.temp }}/talk-paired-package
      - name: Admit immutable source-bound paired package
        run: |
          python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);artifact=root/'talk-paired-package'
          package=artifact/'openclaw-2026.10.3.tgz'
          expected='357c380c2725b90a9b07bd6fe4881c5627a1790ddcfb963f10c67ebe6745d517'
          assert hashlib.sha256(package.read_bytes()).hexdigest()==expected
          assert (artifact/'source-head.txt').read_text().strip()==os.environ['CANDIDATE_SHA']
          with tarfile.open(package) as archive:
              build=json.load(archive.extractfile('package/dist/build-info.json'))
              plugin=json.load(archive.extractfile('package/dist/extensions/nextcloud-talk/package.json'))
              assert build['commit']==os.environ['CANDIDATE_SHA']
              assert plugin['openclaw']['build']['bundledDist'] is True
              assert plugin['version']=='2026.10.3'
          evidence=root/'nextcloud-compat-evidence';evidence.mkdir(exist_ok=True)
          (evidence/'package-admission.json').write_text(json.dumps({'sourceHead':os.environ['CANDIDATE_SHA'],'packageSha256':expected,'producerRun':38826014761,'artifactId':12014584447,'buildInfo':build,'bundledPlugin':plugin},indent=2)+'\n')
          PY
      - name: Pin and download current published stable with integrity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nextcloud-compat-baseline"
          npm view openclaw@latest version dist --json > "$RUNNER_TEMP/nextcloud-compat-baseline/metadata.json"
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'nextcloud-compat-baseline'
          meta=json.loads((root/'metadata.json').read_text())
          assert meta['version']=='2026.10.4','Stable changed: explicitly reselect baseline'
          url=meta['dist']['tarball'];assert url.startswith('https://registry.npmjs.org/openclaw/')
          data=urllib.request.urlopen(url,timeout=120).read()
          assert 'sha512-'+base64.b64encode(hashlib.sha512(data).digest()).decode()==meta['dist']['integrity']
          (root/'openclaw-stable.tgz').write_bytes(data)
          PY
      - name: Exercise actual installed CLI and configured Gateway paths
        env:
          QA_LEG: data-survival
          BASELINE_EXPECTED_VERSION: '2026.10.4'
          CANDIDATE_TARBALL: ${{ runner.temp }}/talk-paired-package/openclaw-2026.10.3.tgz
          BASELINE_METADATA: ${{ runner.temp }}/nextcloud-compat-baseline/metadata.json
          BASELINE_TARBALL: ${{ runner.temp }}/nextcloud-compat-baseline/openclaw-stable.tgz
        run: node .proof-tools/.qa/talk-compatibility/run-installed.mjs
      - name: Record immutable tool and baseline identities
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nextcloud-compat-evidence"
          sha256sum .proof-tools/.qa/talk-compatibility/* > "$RUNNER_TEMP/nextcloud-compat-evidence/proof-tools.sha256"
          if test -f "$RUNNER_TEMP/nextcloud-compat-baseline/metadata.json"; then
            cp "$RUNNER_TEMP/nextcloud-compat-baseline/metadata.json" "$RUNNER_TEMP/nextcloud-compat-evidence/baseline-metadata.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-configured-data-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-compat-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
