name: Paired Talk host package and focused review delta
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_OPTIONS: --max-old-space-size=8192
  CANDIDATE_SHA: 412fb31d86cab77ff8fd711d80ddbf5ca2dc6a6e
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 412fb31d86cab77ff8fd711d80ddbf5ca2dc6a6e
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'true'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
          build-all-cache-scope: full
      - name: Focused test reduction and exact-file checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/talk-readiness-package"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-messaging.config.ts extensions/nextcloud-talk/src/inbound-media.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/talk-readiness-package/focused-tests.log"
          pnpm exec oxfmt --check extensions/nextcloud-talk/src/inbound-media.test.ts
          node scripts/run-oxlint.mjs --tsconfig extensions/tsconfig.json extensions/nextcloud-talk/src/inbound-media.test.ts
          git diff --exit-code
      - name: Canonical installable matching host and Talk package
        env:
          GIT_COMMIT: 412fb31d86cab77ff8fd711d80ddbf5ca2dc6a6e
        run: |
          set -euo pipefail
          node scripts/package-openclaw-for-docker.mjs --bundle-plugin nextcloud-talk --allow-unreleased-changelog --output-dir "$RUNNER_TEMP/talk-readiness-package" --output-name openclaw-2026.10.3.tgz --pack-json "$RUNNER_TEMP/talk-readiness-package/pack.json"
          sha256sum "$RUNNER_TEMP/talk-readiness-package/openclaw-2026.10.3.tgz" > "$RUNNER_TEMP/talk-readiness-package/package.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/talk-readiness-package/source-head.txt"
          python3 - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'talk-readiness-package'
          with tarfile.open(root/'openclaw-2026.10.3.tgz') as archive:
              build = json.load(archive.extractfile('package/dist/build-info.json'))
              plugin = json.load(archive.extractfile('package/dist/extensions/nextcloud-talk/package.json'))
              assert build['commit'] == os.environ['CANDIDATE_SHA']
              assert plugin['openclaw']['build']['bundledDist'] is True
              assert plugin['name'] == '@openclaw/nextcloud-talk'
          (root/'package-identity.json').write_text(json.dumps({'build':build, 'plugin':plugin, 'scope':'unpublished paired PR host and plugin; not stock-host qualification'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: talk-readiness-package-${{ github.run_id }}
          path: ${{ runner.temp }}/talk-readiness-package/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
