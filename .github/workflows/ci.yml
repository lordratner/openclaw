name: Talk PR public-read regression and repair proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [original-reader, repaired-reader]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CI: "true"
      OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
    steps:
      - name: Checkout exact previously failing test merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 5242fb64df13ecdb53aedaf56b5919996f0ad476
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "5242fb64df13ecdb53aedaf56b5919996f0ad476"
          test -z "$(git status --short)"
      - name: Prepare frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          frozen-lockfile: "true"
          cache-mode: off
      - name: Apply regression and conditional owner repair
        env:
          ROLE: ${{ matrix.role }}
          REGRESSION_PATCH_BASE64: 
          PRODUCTION_PATCH_BASE64: 
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          names = ['REGRESSION'] + (['PRODUCTION'] if os.environ['ROLE'] == 'repaired-reader' else [])
          for name in names:
              p = Path(os.environ['RUNNER_TEMP'], name.lower() + '.patch')
              p.write_bytes(base64.b64decode(os.environ[name + '_PATCH_BASE64']))
              subprocess.run(['git', 'apply', '--check', str(p)], check=True)
              subprocess.run(['git', 'apply', str(p)], check=True)
          # Proof-only call-through attestation: do not replace worker behavior/results.
          test = Path('src/gateway/control-ui-public-session-read.test.ts')
          text = test.read_text()
          text = 'import * as workerPatches from "../config/sessions/session-entry-patch.js";\n' + text
          start = text.index('  it("revalidates current sharing after a worker metadata publication during history"')
          stop = text.index('\n  it.each(', start)
          case = text[start:stop]
          case = case.replace('      const read = transcriptReaders.', '      const workerPatch = vi.spyOn(workerPatches, "patchSessionEntryInWorker");\n      const read = transcriptReaders.', 1)
          case = case.replace('          await patchSessionEntryCore(', '          const committed = await patchSessionEntryCore(', 1)
          case = case.replace('          return result;', '          expect(workerPatch).toHaveBeenCalledTimes(1);\n          expect(committed).toMatchObject({ label: "Still public", publicShare: { id: locator.shareId } });\n          return result;', 1)
          test.write_text(text[:start] + case + text[stop:])
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Build QA runtime from candidate source
        run: pnpm build qaRuntime
      - name: Run owner file including worker publication regression and late denial cases
        run: |
          set -o pipefail
          /usr/bin/time -p pnpm test src/gateway/control-ui-public-session-read.test.ts --maxWorkers=1 --pool=forks --silent=false --reporter=verbose --reporter=json --outputFile="$RUNNER_TEMP/read-regression.json" 2>&1 | tee "$RUNNER_TEMP/read-regression.log"
      - name: Retain exact source and applied diff
        if: always()
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          diff = subprocess.check_output(['git', 'diff', '--binary'], text=True)
          Path(os.environ['RUNNER_TEMP'], 'applied.patch').write_text(diff)
          Path(os.environ['RUNNER_TEMP'], 'source.json').write_text(json.dumps({
              'role': os.environ['ROLE'],
              'expectedSha': '5242fb64df13ecdb53aedaf56b5919996f0ad476',
              'actualSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'status': subprocess.check_output(['git', 'status', '--short'], text=True),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'regressionPatchSha256': '3aeeb64b715590525b8a5491049917d2108d42bbc008bb9e7876aac0385bb504',
              'productionPatchSha256': 'e73811dc0b8edeace9fffc0929bbb359568515839be2049ae1f5a4c6767d8a52',
              'appliedDiffSha256': hashlib.sha256(diff.encode()).hexdigest(),
              'runId': os.environ['GITHUB_RUN_ID'],
              'pool': 'forks',
              'proofOnlyWorkerCallThroughAttestation': True,
          }, indent=2) + '\n')
          PY
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-read-${{ matrix.role }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/read-regression.log
            ${{ runner.temp }}/read-regression.json
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/applied.patch
          retention-days: 7
