name: Exact 9.8 Talk attachment canary qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify-release-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS: nextcloud-talk
      OPENCLAW_VITEST_MAX_WORKERS: "2"
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
    steps:
      - name: Capture reviewed disposable-branch payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve payload outside source checkout
        run: |
          cp -a canary-payload "$RUNNER_TEMP/canary-payload"
          git rev-parse HEAD > "$RUNNER_TEMP/canary-payload/workflow-commit.txt"
      - name: Checkout exact installed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: fc23bc864e4553c2d215e479eeec47b67a0bf943
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare exact release frozen dependency graph on GitHub only
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          frozen-lockfile: "true"
          cache-mode: "off"
      - name: Finish only exact-source uncompleted qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/canary-payload/run-release-resume-ci.sh"
      - name: Retain attributable qualification and artifact boundary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextcloud-talk-release-9_8-${{ github.run_id }}
          path: ${{ runner.temp }}/release-canary-proof/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
