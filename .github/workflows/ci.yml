name: Qualify exact Talk fixture repair with guarded retained runtime proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: 303b40cfe25aef9012e3c8c1d20e23a63ba70c7f
  BASE_SHA: dcc6e4910d3b85c8636b971d4d8ebc221efcd2b4
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 303b40cfe25aef9012e3c8c1d20e23a63ba70c7f
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38924024210
          name: nextcloud-outbound-proof-38924024210
          path: ${{ runner.temp }}/nextcloud-outbound-prior
      - name: Admit only exact fixture delta and actual retained passing evidence
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .proof-tools/.qa/nextcloud-outbound/review-resume/resume.sh prepare
      - name: Check formatting and lint affected test
        id: formatlint
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/review-resume/resume.sh formatlint
      - name: Build fresh runtime prerequisites
        id: workers
        if: ${{ always() && steps.admit.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh workers
      - name: Run all 35 automatic and authorization cases freshly
        id: automatic
        if: ${{ always() && steps.admit.outcome == 'success' && steps.workers.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/review-resume/resume.sh automatic
      - name: Run test types freshly
        id: types
        if: ${{ always() && steps.admit.outcome == 'success' && steps.workers.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/review-resume/resume.sh types
      - name: Re-prove three original and three reviewed automatic controls
        id: negative
        if: ${{ always() && steps.admit.outcome == 'success' && steps.workers.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/review-resume/resume.sh negative
      - name: Require every actual fresh outcome and all retained bindings
        if: always()
        env:
          QUALIFICATION_GATES: '{"admit":"${{ steps.admit.outcome }}","formatlint":"${{ steps.formatlint.outcome }}","workers":"${{ steps.workers.outcome }}","automatic":"${{ steps.automatic.outcome }}","types":"${{ steps.types.outcome }}","negative":"${{ steps.negative.outcome }}"}'
        run: bash .proof-tools/.qa/nextcloud-outbound/review-resume/resume.sh finalize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
