name: Admit exact10.3 voice canary after semantic validator-only repair
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          sparse-checkout: .qa/nextcloud-voice-canary-10.3/validator
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 39462358474
          name: nextcloud-voice-canary-10.3-39462358474
          path: ${{ runner.temp }}/original-voice-canary
      - name: Revalidate exact negative-control assertions without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_PROOF_DIR: ${{ runner.temp }}/original-voice-canary
        run: python3 .qa/nextcloud-voice-canary-10.3/validator/admit.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-voice-canary-10.3-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-voice-canary-10.3/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
