name: Qualify native Talk against existing upstream completion fix
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: ca18124c8a500d2507103741414a02f6f313c52b
  BASE_SHA: dcc6e4910d3b85c8636b971d4d8ebc221efcd2b4
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ca18124c8a500d2507103741414a02f6f313c52b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - name: Format and lint exact feature source
        id: prepare
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh prepare
      - name: Build runtime prerequisites
        id: workers
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh workers
      - name: Prove original-source missing-upload controls
        id: negative
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.workers.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh negative
      - name: Native and inbound messaging regressions
        id: messaging
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.workers.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/integration.sh messaging
      - name: Automatic reply and authorization regressions
        id: automatic
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.workers.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/integration.sh automatic
      - name: Production and test types
        id: types
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh types
      - name: Documentation checks
        id: docs
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh docs
      - name: Build paired installable package
        id: package
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh package
      - name: Require every actual gate and unmodified upstream fix
        if: always()
        env:
          QUALIFICATION_GATES: '{"prepare":"${{ steps.prepare.outcome }}","workers":"${{ steps.workers.outcome }}","negative":"${{ steps.negative.outcome }}","messaging":"${{ steps.messaging.outcome }}","automatic":"${{ steps.automatic.outcome }}","types":"${{ steps.types.outcome }}","docs":"${{ steps.docs.outcome }}","package":"${{ steps.package.outcome }}"}'
        run: bash .proof-tools/.qa/nextcloud-outbound/integration.sh finalize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
