name: Talk PR durable Gateway reader regression and repair proof
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role:
          - original-reader
          - repaired-reader
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CI: "true"
      OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
    steps:
      - name: Checkout exact previously failing test merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 5242fb64df13ecdb53aedaf56b5919996f0ad476
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        run: >
          test "$(git rev-parse HEAD)" =
          "5242fb64df13ecdb53aedaf56b5919996f0ad476"

          test -z "$(git status --short)"
      - name: Prepare frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: "false"
          frozen-lockfile: "true"
          cache-mode: off
      - name: Apply regression and conditional owner repair
        env:
          ROLE: ${{ matrix.role }}
          REGRESSION_PATCH_BASE64: 
          PRODUCTION_PATCH_BASE64: 
        run: >
          python3 - <<'PY'

          import base64, os, subprocess

          from pathlib import Path

          names = ['REGRESSION'] + (['PRODUCTION'] if os.environ['ROLE'] ==
          'repaired-reader' else [])

          for name in names:
              p = Path(os.environ['RUNNER_TEMP'], name.lower() + '.patch')
              p.write_bytes(base64.b64decode(os.environ[name + '_PATCH_BASE64']))
              subprocess.run(['git', 'apply', '--check', str(p)], check=True)
              subprocess.run(['git', 'apply', str(p)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)

          PY
      - name: Build QA runtime from candidate source
        run: pnpm build qaRuntime
      - name: Run whole fork-owned Gateway prepared-read file with shipping regressions
        run: >
          set -o pipefail

          /usr/bin/time -p pnpm test
          src/gateway/session-row-projection.prepared-read.test.ts
          --maxWorkers=1 --silent=false --reporter=verbose --reporter=json
          --outputFile="$RUNNER_TEMP/read-regression.json" 2>&1 | tee
          "$RUNNER_TEMP/read-regression.log"
      - name: Retain exact source and applied diff
        if: always()
        env:
          ROLE: ${{ matrix.role }}
        run: >
          python3 - <<'PY'

          import hashlib, json, os, subprocess

          from pathlib import Path

          diff = subprocess.check_output(['git', 'diff', '--binary'], text=True)

          Path(os.environ['RUNNER_TEMP'], 'applied.patch').write_text(diff)

          Path(os.environ['RUNNER_TEMP'], 'source.json').write_text(json.dumps({
              'role': os.environ['ROLE'],
              'expectedSha': '5242fb64df13ecdb53aedaf56b5919996f0ad476',
              'actualSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'status': subprocess.check_output(['git', 'status', '--short'], text=True),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'regressionPatchSha256': 'cdffb1a84c907b253a8e44d51a6ae8fa7fa68b55f9e006e4bc1f388b7b11102c',
              'productionPatchSha256': '8c8c44dfd0e80f0810e0456a564ac21a682dd8ea655a13f94bae3a661a7ad56d',
              'appliedDiffSha256': hashlib.sha256(diff.encode()).hexdigest(),
              'runId': os.environ['GITHUB_RUN_ID'],
              'pool': 'repository-owned Gateway database-worker forks; no CLI pool override',
              'shippingWorkerCallThroughAttestation': True,
          }, indent=2) + '\n')

          PY
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-read-${{ matrix.role }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/read-regression.log
            ${{ runner.temp }}/read-regression.json
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/applied.patch
          retention-days: 7
