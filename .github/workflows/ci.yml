name: Talk quoted replies installed Gateway proof
on:
  workflow_dispatch:
    inputs:
      source:
        required: true
        type: string
      qualificationRun:
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SOURCE_SHA: ${{ inputs.source }}
  QUALIFICATION_RUN: ${{ inputs.qualificationRun }}
  NODE_OPTIONS: --max-old-space-size=8192
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.source }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-quotes
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - name: Admit retained successful qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/lordratner/openclaw/actions/runs/$QUALIFICATION_RUN" > "$RUNNER_TEMP/retained-run.json"
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/retained-run.json")); assert r["conclusion"]=="success" and r["status"]=="completed" and r["head_sha"]=="e36a5cc5210e7ace14af6bb2a59bf87317d5b522"'
          gh run download "$QUALIFICATION_RUN" --repo lordratner/openclaw --name "quoted-replies-qualified-$QUALIFICATION_RUN" --dir .retained-qualification
      - name: Check proof script syntax
        run: |
          node --check .proof-tools/.qa/nextcloud-quotes/gateway-proof.mjs
          node --check .proof-tools/.qa/nextcloud-quotes/native-gateway-proof.mjs
      - name: Build and prove exact installable candidate
        run: python3 .proof-tools/.qa/nextcloud-quotes/package-proof.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quoted-replies-installed-prefix-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quoted-replies-installed/installed-prefix.tgz
            ${{ runner.temp }}/quoted-replies-installed/installed-prefix-identity.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quoted-replies-package-${{ github.run_id }}
          path: ${{ runner.temp }}/quoted-replies-installed/quoted-replies.tgz
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Preserve bounded evidence, not package payload
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/quoted-replies-installed-evidence"
          python3 - <<'PYPROOF'
          import os,pathlib,shutil
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'quoted-replies-installed';target=pathlib.Path(os.environ['RUNNER_TEMP'])/'quoted-replies-installed-evidence'
          if source.exists():
            for p in source.rglob('*'):
              if p.is_file() and p.suffix in ['.json','.jsonl','.log']:
                q=target/p.relative_to(source);q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
          PYPROOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quoted-replies-installed-${{ github.run_id }}
          path: ${{ runner.temp }}/quoted-replies-installed-evidence/
          if-no-files-found: error
          retention-days: 14
