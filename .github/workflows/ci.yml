name: Talk quoted replies original-source reproduction
on:
  workflow_dispatch:
    inputs:
      source:
        description: Immutable test-only source commit
        required: true
        type: string
permissions:
  contents: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  OPENCLAW_VITEST_MAX_WORKERS: '1'
  OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS: nextcloud-talk
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ inputs.source }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-quotes
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - name: Build normal runtime prerequisites
        run: pnpm build qaRuntime
      - name: Require actual missing-quote assertion failures and passing controls
        run: python3 .proof-tools/.qa/nextcloud-quotes/baseline.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quoted-replies-original-${{ github.run_id }}
          path: ${{ runner.temp }}/quoted-replies-proof/
          if-no-files-found: error
          retention-days: 14
