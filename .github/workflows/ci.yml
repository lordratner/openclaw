name: Finish Talk test-fixture typing; retain guarded package proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: 1b529270554492880215576d71223df29484efa6
  BASE_SHA: 446d17b6432bdf1e8748863fc197977bcda49c2d
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 1b529270554492880215576d71223df29484efa6
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38860463628
          name: nextcloud-outbound-proof-38860463628
          path: ${{ runner.temp }}/nextcloud-outbound-prior
      - name: Admit test-only repair and retained package proof
        id: admit
        run: bash .proof-tools/.qa/nextcloud-outbound/type-finish.sh prepare
      - name: Build runtime prerequisites for changed test fixture
        id: workers
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh workers
      - name: Updated fixture lint, test types and automatic reply cases
        id: checks
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/type-finish.sh checks
      - name: Re-prove automatic missing-upload controls on original source
        id: negative
        if: ${{ always() && steps.admit.outcome == 'success' && steps.workers.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/type-finish.sh negative
      - name: Fail unless every collected gate passed
        if: always()
        env:
          QUALIFICATION_GATES: '{"admit":"${{ steps.admit.outcome }}","workers":"${{ steps.workers.outcome }}","checks":"${{ steps.checks.outcome }}","negative":"${{ steps.negative.outcome }}"}'
        run: bash .proof-tools/.qa/nextcloud-outbound/type-finish.sh finalize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
