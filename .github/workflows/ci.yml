name: Prepare Talk review revision
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  CANDIDATE_SHA: 56701c6e0c876803581b7d72c4b606076dcb2622
  BASE_SHA: dcc6e4910d3b85c8636b971d4d8ebc221efcd2b4
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 56701c6e0c876803581b7d72c4b606076dcb2622
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - name: Format and lint reviewed plugin revision
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-format-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-proof/
          if-no-files-found: error
