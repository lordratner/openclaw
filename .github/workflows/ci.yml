name: Talk PR pinned MCP dependency graph and audit
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: "true"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - name: Checkout fixed published candidate, not moving main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 9ed34bae60dee85442f80258732f8300f411a393
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare pinned Node and repository pnpm without installing dependencies
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: "false"
          install-deps: "false"
          cache-mode: off
      - name: Apply exact approved five pins
        env:
          MANIFEST_PATCH_BASE64: 
        run: |
          python3 - <<'PYCODE'
          import base64, os, subprocess, hashlib
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='9ed34bae60dee85442f80258732f8300f411a393'
          assert not subprocess.check_output(['git','status','--short'],text=True)
          patch=base64.b64decode(os.environ['MANIFEST_PATCH_BASE64'])
          assert hashlib.sha256(patch).hexdigest()=='79093dbbec227adb4fd64aed870326280c06723350623644da29444328711746'
          path=Path(os.environ['RUNNER_TEMP'],'manifest.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PYCODE
      - name: Regenerate only dependency lock using repository policy
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/mcp-lock-generation.log"
      - name: Assert patched complete production graph
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { collectProdResolvedPackagesFromLockfile } from './scripts/pre-commit/pnpm-audit-prod.mjs';
          const lock=fs.readFileSync('pnpm-lock.yaml','utf8');
          const graph=collectProdResolvedPackagesFromLockfile(lock);
          const expected={'@modelcontextprotocol/sdk':'1.31.0','@modelcontextprotocol/client':'2.2.0','@modelcontextprotocol/core':'2.2.0'};
          const selected={};
          for(const [name,version] of Object.entries(expected)){
            selected[name]=[...(graph.get(name)||[])].sort();
            assert.deepEqual(selected[name],[version]);
          }
          assert(!/['"]?@modelcontextprotocol\/(sdk@1\.30\.1|client@2\.0\.0|core@2\.0\.0)/u.test(lock));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/mcp-resolved-versions.json',JSON.stringify(selected,null,2)+'\n');
          console.log(selected);
          JS
      - name: Run unchanged production audit, no release warning exception
        run: |
          set -euo pipefail
          node scripts/pre-commit/pnpm-audit-prod.mjs --audit-level=high 2>&1 | tee "$RUNNER_TEMP/mcp-production-audit.log"
      - name: Retain reviewed graph and exact source receipts
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, hashlib, json, shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'],'mcp-graph');root.mkdir(exist_ok=True)
          files=['package.json','extensions/browser/package.json','extensions/qa-lab/package.json','ui/package.json','pnpm-lock.yaml']
          hashes={}
          for name in files:
            src=Path(name);dst=root/name;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst);hashes[name]=hashlib.sha256(src.read_bytes()).hexdigest()
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines();assert set(changed)<=set(files),changed
          diff=subprocess.check_output(['git','diff','--binary'],text=True);(root/'applied.patch').write_text(diff)
          source={'expectedSha':'9ed34bae60dee85442f80258732f8300f411a393','actualSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'node':subprocess.check_output(['node','--version'],text=True).strip(),'pnpm':subprocess.check_output(['pnpm','--version'],text=True).strip(),'changed':changed,'fileSha256':hashes,'appliedDiffSha256':hashlib.sha256(diff.encode()).hexdigest(),'runId':os.environ['GITHUB_RUN_ID'],'permissions':'contents read; secretless; no runtime'}
          (root/'source.json').write_text(json.dumps(source,indent=2)+'\n')
          for name in ['mcp-lock-generation.log','mcp-resolved-versions.json','mcp-production-audit.log']:
            src=Path(os.environ['RUNNER_TEMP'],name)
            if src.exists():shutil.copy2(src,root/name)
          subprocess.run(['git','diff','--check'],check=True)
          PYCODE
      - name: Upload fixed candidate graph evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-patched-graph-${{ github.run_id }}
          path: ${{ runner.temp }}/mcp-graph/
          retention-days: 7
