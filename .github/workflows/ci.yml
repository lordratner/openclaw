name: Existing Nextcloud bot-only installation upgrade and native delivery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: 303b40cfe25aef9012e3c8c1d20e23a63ba70c7f
  QUALIFIED_RUN_ID: '38928275784'
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .qa/nextcloud-outbound
      - name: Refuse unbound recipe
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['CANDIDATE_SHA'])
          assert re.fullmatch(r'[1-9][0-9]+', os.environ['QUALIFIED_RUN_ID'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 383c124cc32ffee3f8e56f549b88da94d269a4af
          path: .stable-fixture
          sparse-checkout: scripts/e2e/lib/fixtures/mock-openai-config.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: ${{ env.QUALIFIED_RUN_ID }}
          name: nextcloud-outbound-proof-${{ env.QUALIFIED_RUN_ID }}
          path: ${{ runner.temp }}/nextcloud-outbound-package
      - name: Admit exact successful producer and source-bound package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .qa/nextcloud-outbound/upgrade/admit-package.py
      - name: Start disposable official Nextcloud and released Talk
        run: bash .qa/nextcloud-outbound/start-nextcloud.sh
      - name: Prove actual published 10.4 then same-prefix existing-state upgrade
        env:
          CANDIDATE_TARBALL: ${{ runner.temp }}/nextcloud-outbound-package/openclaw-outbound.tgz
          STABLE_MODEL_FIXTURE: ${{ github.workspace }}/.stable-fixture/scripts/e2e/lib/fixtures/mock-openai-config.mjs
          RUN_CONFIGURED_NATIVE_CONTROL: 'true'
        run: node .qa/nextcloud-outbound/upgrade/upgrade-nextcloud.mjs
      - name: Collect owned fixture diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nextcloud-outbound-live/evidence"
          docker logs nextcloud-outbound-proof > "$RUNNER_TEMP/nextcloud-outbound-live/evidence/container.log" 2>&1 || true
          docker rm --force nextcloud-outbound-proof || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-upgrade-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-live/evidence/
          if-no-files-found: error
          retention-days: 14
  native:
    # Existing canonical fresh native proof, unchanged, in a separate disposable
    # runner/container. This must not overwrite the upgrade installation/state.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .qa/nextcloud-outbound
      - name: Refuse unbound recipe
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['CANDIDATE_SHA'])
          assert re.fullmatch(r'[1-9][0-9]+', os.environ['QUALIFIED_RUN_ID'])
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ env.CANDIDATE_SHA }}
          path: .candidate-source
          sparse-checkout: scripts/e2e/lib/fixtures/mock-openai-config.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: ${{ env.QUALIFIED_RUN_ID }}
          name: nextcloud-outbound-proof-${{ env.QUALIFIED_RUN_ID }}
          path: ${{ runner.temp }}/nextcloud-outbound-package
      - name: Admit exact successful producer and source-bound package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .qa/nextcloud-outbound/upgrade/admit-package.py
      - name: Start independent disposable official Nextcloud and released Talk
        run: bash .qa/nextcloud-outbound/start-nextcloud.sh
      - name: Reuse existing installed native CLI and Gateway proof
        env:
          CANDIDATE_TARBALL: ${{ runner.temp }}/nextcloud-outbound-package/openclaw-outbound.tgz
          OPENCLAW_QA_SOURCE_ROOT: ${{ github.workspace }}/.candidate-source
          OPENCLAW_QA_COMPLETION_INSPECTOR: '0'
        run: node .qa/nextcloud-outbound/real-nextcloud.mjs
      - name: Collect owned fixture diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nextcloud-outbound-live/evidence"
          docker logs nextcloud-outbound-proof > "$RUNNER_TEMP/nextcloud-outbound-live/evidence/container.log" 2>&1 || true
          docker rm --force nextcloud-outbound-proof || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-native-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-live/evidence/
          if-no-files-found: error
          retention-days: 14
