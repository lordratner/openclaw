name: Finish native Talk qualification with explicit gate collection
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: 04aadd6b3aa638815eb7c4ac48b8a30b531ba4ca
  BASE_SHA: 446d17b6432bdf1e8748863fc197977bcda49c2d
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 04aadd6b3aa638815eb7c4ac48b8a30b531ba4ca
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38857234209
          name: nextcloud-outbound-proof-38857234209
          path: ${{ runner.temp }}/nextcloud-outbound-prior
      - name: Admit byte-identical production and retained proof
        id: admit
        run: bash .proof-tools/.qa/nextcloud-outbound/finish.sh prepare
      - name: Build runtime prerequisites for pending automatic tests
        id: workers
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh workers
      - name: Rerun affected security cases
        id: security
        if: ${{ always() && steps.admit.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/finish.sh security
      - name: Exercise pending automatic replies, authorization and mentions
        id: automatic
        if: ${{ always() && steps.admit.outcome == 'success' && steps.workers.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/finish.sh automatic
      - name: Production and test types
        id: types
        if: ${{ always() && steps.admit.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh types
      - name: Updated security fixture lint
        id: lint
        if: ${{ always() && steps.admit.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/finish.sh lint
      - name: Documentation checks
        id: docs
        if: ${{ always() && steps.admit.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh docs
      - name: Canonical paired package
        id: package
        if: ${{ always() && steps.admit.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh package
      - name: Plugin startup profile
        id: profile
        if: ${{ always() && steps.package.outcome == 'success' }}
        continue-on-error: true
        run: bash .proof-tools/.qa/nextcloud-outbound/finish.sh profile
      - name: Fail unless every collected gate passed
        if: always()
        env:
          QUALIFICATION_GATES: '{"admit":"${{ steps.admit.outcome }}","workers":"${{ steps.workers.outcome }}","security":"${{ steps.security.outcome }}","automatic":"${{ steps.automatic.outcome }}","types":"${{ steps.types.outcome }}","lint":"${{ steps.lint.outcome }}","docs":"${{ steps.docs.outcome }}","package":"${{ steps.package.outcome }}","profile":"${{ steps.profile.outcome }}"}'
        run: bash .proof-tools/.qa/nextcloud-outbound/finish.sh finalize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
