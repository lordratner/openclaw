name: Complete native Talk send and automatic reply qualification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: 7cb2de043c1576c8f0a6e0a78a92344d17667d09
  BASE_SHA: 446d17b6432bdf1e8748863fc197977bcda49c2d
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 7cb2de043c1576c8f0a6e0a78a92344d17667d09
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - name: Format and lint complete plugin change
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh prepare
      - name: Build registered runtime worker prerequisites
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh workers
      - name: Prove original direct and automatic paths fail native-upload controls
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh negative
      - name: Test native sends and automatic replies with auth and mention siblings
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh tests
      - name: Check production and test types
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh types
      - name: Check documentation
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh docs
      - name: Build canonical installable Talk and default-provider host package
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh package
      - name: Qualify plugin startup and exact source package identity
        run: bash .proof-tools/.qa/nextcloud-outbound/complete.sh profile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
