name: Talk PR public-session diagnostic comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream-control
            sha: 493b90b2ba91d6d70e7b6784e475ff15f0aa891c
          - label: observed-pr-merge
            sha: 92fae7fb99e4575d4641417e0809ccc24f221ec7
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CI: "true"
      OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git status --short
          git rev-parse HEAD
      - name: Prepare frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          frozen-lockfile: "true"
          cache-mode: off
      - name: Build same QA runtime as original CI
        run: pnpm build qaRuntime
      - name: Run original public-session composition with visible diagnostics
        run: |
          set -o pipefail
          /usr/bin/time -p pnpm test src/gateway/x-publication-owner-composition.e2e.test.ts --maxWorkers=1 --silent=false --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/public-session.log"
      - name: Capture diagnostic source identity
        if: always()
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          LABEL: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'source.json').write_text(json.dumps({
              'label': os.environ['LABEL'],
              'expectedSha': os.environ['EXPECTED_SHA'],
              'actualSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'status': subprocess.check_output(['git', 'status', '--short'], text=True),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }, indent=2) + '\n')
          PY
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-session-${{ matrix.label }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-session.log
            ${{ runner.temp }}/source.json
          retention-days: 7
