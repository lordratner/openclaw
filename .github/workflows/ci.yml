name: Native outbound attachments on official Nextcloud
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: lordratner/openclaw
          run-id: 38912379095
          name: nextcloud-outbound-proof-38912379095
          path: ${{ runner.temp }}/nextcloud-outbound-package
      - name: Admit qualified paired package
        run: |
          python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'nextcloud-outbound-package'
          receipt=json.loads((root/'qualification.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['candidate']=='ca18124c8a500d2507103741414a02f6f313c52b'
          assert hashlib.sha256((root/'openclaw-outbound.tgz').read_bytes()).hexdigest()==receipt['packageSha256']
          assert hashlib.sha256((root/'source-manifest.json').read_bytes()).hexdigest()==receipt['sourceManifestSha256']
          with tarfile.open(root/'openclaw-outbound.tgz') as archive:
            build=json.load(archive.extractfile('package/dist/build-info.json'))
            assert build['commit']==receipt.get('packageCandidate',receipt['candidate'])
          # A fixture-only typing repair reused identical production bytes.
          if receipt.get('packageCandidate',receipt['candidate'])!=receipt['candidate']:
            assert receipt['productionBytesUnchanged'] is True
          evidence=Path(os.environ['RUNNER_TEMP'])/'nextcloud-outbound-live/evidence'
          evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'package-admission.json').write_text(json.dumps({'status':'PASS','producerRun':38912379095,'candidate':receipt['candidate'],'packageCandidate':receipt.get('packageCandidate',receipt['candidate']),'packageSha256':receipt['packageSha256'],'sourceManifestSha256':receipt['sourceManifestSha256'],'upstreamDependencyFixPR':receipt.get('upstreamDependencyFixPR')},indent=2)+'\n')
          PY
      - name: Start disposable official Nextcloud and released Talk
        run: bash .qa/nextcloud-outbound/start-nextcloud.sh
      - name: Prove installed CLI native share and recipient download
        env:
          CANDIDATE_TARBALL: ${{ runner.temp }}/nextcloud-outbound-package/openclaw-outbound.tgz
          OPENCLAW_QA_COMPLETION_INSPECTOR: '0'
        run: node .qa/nextcloud-outbound/real-nextcloud.mjs
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nextcloud-outbound-live/evidence"
          docker logs nextcloud-outbound-proof > "$RUNNER_TEMP/nextcloud-outbound-live/evidence/container.log" 2>&1 || true
          docker rm --force nextcloud-outbound-proof || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-native-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-live/evidence/
          if-no-files-found: error
          retention-days: 14
