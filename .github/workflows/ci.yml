name: Nextcloud outbound attachment qualification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CANDIDATE_SHA: f9b2dd6a8c97bdae694f95017420a6480ffd3e2e
  BASE_SHA: 446d17b6432bdf1e8748863fc197977bcda49c2d
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: f9b2dd6a8c97bdae694f95017420a6480ffd3e2e
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: ${{ github.sha }}
          path: .proof-tools
          sparse-checkout: .qa/nextcloud-outbound
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          semantic-checks: 'true'
          frozen-lockfile: 'true'
          cache-mode: restore
      - name: Bind proof tools and qualify production paths
        run: |
          mkdir -p .qa/nextcloud-outbound
          cp .proof-tools/.qa/nextcloud-outbound/* .qa/nextcloud-outbound/
          bash .qa/nextcloud-outbound/qualify.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nextcloud-outbound-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/nextcloud-outbound-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
