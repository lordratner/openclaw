name: Talk PR canonical public-read guard diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream-control
            sha: 8177060846209e40a506e442785a7736f31db674
          - label: observed-pr-merge
            sha: 5242fb64df13ecdb53aedaf56b5919996f0ad476
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CI: "true"
      OPENCLAW_PUBLIC_READ_DIAGNOSTICS: "1"
      OPENCLAW_VITEST_MAX_WORKERS: "2"
      OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
      OPENCLAW_NODE_TEST_TARGETS_JSON: '["src/gateway/x-publication-owner-composition.e2e.test.ts", "src/plugins/contracts/channel-config-writes.contract.test.ts", "src/plugins/contracts/channel-history-limit.contract.test.ts", "src/plugins/contracts/channel-media-max-mb.contract.test.ts", "src/plugins/contracts/channel-reply-to-mode.contract.test.ts", "src/plugins/contracts/channel-response-prefix.contract.test.ts", "src/plugins/contracts/config-footprint-guardrails.test.ts"]'
      OPENCLAW_NODE_TEST_CONFIGS_JSON: '[]'
      OPENCLAW_NODE_TEST_ENV_JSON: 'null'
      OPENCLAW_NODE_TEST_INCLUDE_PATTERNS_JSON: 'null'
      OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: '["--silent=false", "--reporter=verbose"]'
      OPENCLAW_VITEST_SHARD_NAME: changed-1-diagnostic
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
      OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE: "1"
      OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ matrix.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git status --short
          git rev-parse HEAD
      - name: Prepare frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          frozen-lockfile: "true"
          cache-mode: off
      - name: Apply reviewed static diagnostic tags before QA build
        env:
          DIAGNOSTIC_PATCH_BASE64: 
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'], 'public-read-diagnostic.patch')
          p.write_bytes(base64.b64decode(os.environ['DIAGNOSTIC_PATCH_BASE64']))
          subprocess.run(['git', 'apply', '--check', str(p)], check=True)
          subprocess.run(['git', 'apply', str(p)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Build same QA runtime as original CI
        run: pnpm build qaRuntime
      - name: Run original changed-1 shard order with guard diagnostics
        run: |
          set -o pipefail
          /usr/bin/time -p node --import tsx scripts/ci-run-node-test-shard.mts 2>&1 | tee "$RUNNER_TEMP/public-session.log"
      - name: Capture diagnostic source identity
        if: always()
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          LABEL: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'source.json').write_text(json.dumps({
              'label': os.environ['LABEL'],
              'expectedSha': os.environ['EXPECTED_SHA'],
              'actualSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'status': subprocess.check_output(['git', 'status', '--short'], text=True),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'diagnosticDiff': subprocess.check_output(['git', 'diff', '--stat'], text=True),
              'diagnosticPatchSha256': '11cceb4d09ca7c9cf27e816e3e18c68b1ae366b27cbbea6b40d5e9a434228417',
          }, indent=2) + '\n')
          PY
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-session-${{ matrix.label }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-session.log
            ${{ runner.temp }}/source.json
          retention-days: 7
