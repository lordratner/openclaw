name: Talk scope split focused qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  talk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_E2E_USE_PREBUILT_DIST: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: d420728afb1542291a33c1b953749b705cd854bc
          fetch-depth: 1
          persist-credentials: false
      - name: Frozen environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          frozen-lockfile: 'true'
          cache-mode: off
      - name: Source receipt
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/head.txt"
          test "$(git rev-parse HEAD)" = d420728afb1542291a33c1b953749b705cd854bc
          git status --short > "$RUNNER_TEMP/proof/initial-status.txt"
          test -z "$(git status --short)"
      - name: Build canonical QA runtime
        run: |
          set -o pipefail
          /usr/bin/time -p pnpm build qaRuntime 2>&1 | tee "$RUNNER_TEMP/proof/build.log"
      - name: Canonical generated outputs and focused format
        run: |
          set -o pipefail
          pnpm channels:catalog:gen
          pnpm config:channels:gen
          pnpm config:schema:gen
          pnpm config:docs:gen
          git diff --binary > "$RUNNER_TEMP/proof/generated.patch"
          git diff --exit-code
          pnpm exec oxfmt --check extensions/nextcloud-talk src/plugins/runtime/runtime-channel.ts src/plugins/runtime/types-channel.ts src/plugin-sdk/test-helpers/plugin-runtime-media-mock.ts src/plugin-sdk/test-helpers/plugin-runtime-mock.ts extensions/matrix/src/test-runtime.ts
      - name: Single-worker complete Talk suite and cost
        run: |
          set -o pipefail
          /usr/bin/time -p pnpm test extensions/nextcloud-talk --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$RUNNER_TEMP/proof/talk.json" 2>&1 | tee "$RUNNER_TEMP/proof/talk.log"
      - name: Matrix runtime-contract controls
        run: |
          set -o pipefail
          node scripts/run-vitest.mjs run --config test/vitest/vitest.extension-matrix.config.ts --passWithNoTests=false extensions/matrix/src/test-runtime.test.ts extensions/matrix/src/matrix/monitor/handler.media-failure.test.ts --reporter=json --outputFile="$RUNNER_TEMP/proof/matrix.json" 2>&1 | tee "$RUNNER_TEMP/proof/matrix.log"
      - name: Fail closed on selected suite execution
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'proof'
          for name, expected in [('talk',281),('matrix',6)]:
              j=json.loads((p/(name+'.json')).read_text())
              assert j['numTotalTests']==expected, (name,j['numTotalTests'])
              assert j['numPassedTests']==expected and j['numFailedTests']==0 and j['success']
          PYCODE
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: talk-split-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
          retention-days: 7
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role: [original-reader, repaired-reader]
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_E2E_USE_PREBUILT_DIST: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lordratner/openclaw
          ref: 08b49cea773a27c322bb1389ebe7d83b95033219
          fetch-depth: 2
          persist-credentials: false
      - name: Frozen environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: 'false'
          frozen-lockfile: 'true'
          cache-mode: off
      - name: Prepare main control or unchanged draft source
        env:
          ROLE: ${{ matrix.role }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof"
          test "$(git rev-parse HEAD)" = 08b49cea773a27c322bb1389ebe7d83b95033219
          test -z "$(git status --short)"
          if [ "$ROLE" = original-reader ]; then
            git restore --source=390fcec17863174dda480f563f87927738b9ee24 --worktree src/gateway/control-ui-public-session-read.ts
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/proof/head.txt"
          git diff --binary > "$RUNNER_TEMP/proof/applied.patch"
          sha256sum src/gateway/control-ui-public-session-read.ts src/gateway/session-row-projection.prepared-read.test.ts > "$RUNNER_TEMP/proof/source-sha256.txt"
      - name: Build canonical QA runtime
        run: |
          set -o pipefail
          /usr/bin/time -p pnpm build qaRuntime 2>&1 | tee "$RUNNER_TEMP/proof/build.log"
      - name: Regression comparison with existing worker profile and single-worker cost
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -p pnpm test src/gateway/session-row-projection.prepared-read.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$RUNNER_TEMP/proof/gateway.json" 2>&1 | tee "$RUNNER_TEMP/proof/gateway.log"
          result=${PIPESTATUS[0]}
          set -e
          printf '%s
' "$result" > "$RUNNER_TEMP/proof/exit.txt"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'proof';j=json.loads((p/'gateway.json').read_text())
          original=os.environ['ROLE']=='original-reader';failed=3 if original else 0
          assert j['numTotalTests']==18 and j['numFailedTests']==failed and j['numPassedTests']==18-failed, j
          assert int((p/'exit.txt').read_text())==(1 if original else 0)
          if original:
              failures=[x['fullName'] for t in j['testResults'] for x in t['assertionResults'] if x['status']=='failed']
              assert len(failures)==3 and all('sharing' in x for x in failures), failures
          PYCODE
      - name: Public-reader siblings and focused format
        if: matrix.role == 'repaired-reader'
        run: |
          set -o pipefail
          /usr/bin/time -p pnpm test src/gateway/control-ui-public-session-read.test.ts src/gateway/control-ui-public-session.http.test.ts src/gateway/control-ui-public-session.concurrent.test.ts --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/proof/siblings.json" 2>&1 | tee "$RUNNER_TEMP/proof/siblings.log"
          pnpm exec oxfmt --check src/gateway/control-ui-public-session-read.ts src/gateway/session-row-projection.prepared-read.test.ts
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gateway-${{ matrix.role }}-${{ github.run_id }}
          path: ${{ runner.temp }}/proof
          retention-days: 7
